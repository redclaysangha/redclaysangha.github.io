# Builds the site and publishes it to GitHub Pages.
# Runs when something is pushed to main (including edits saved in the editing screen),
# every hour to pick up new or changed events from Wild Apricot, and on demand.
#
# Needs one repository secret: WA_API_KEY (the read-only Wild Apricot key).
# Note: GitHub pauses scheduled runs after 60 days with no commits to the repository;
# any commit, or re-enabling the workflow on the Actions tab, restarts them.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
